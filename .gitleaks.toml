title = "adfs-to-okta-migration"

[extend]
useDefault = true

# Plainly fake values used by the tests. Each entry matches one value in one
# file; no whole file or folder is allowed.
[[allowlists]]
description = "Fake test values"
condition = "AND"
paths = ['''tests/test_app\.py''']
regexes = ['''test-secret-not-real''', '''test-key-not-real''']

[[allowlists]]
description = "Fake test values (settings tests)"
condition = "AND"
paths = ['''tests/test_settings\.py''']
regexes = ['''test-secret-not-real''', '''test-key-not-real''']
